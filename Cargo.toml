[package]
description = "A digital version of the word game Bananagrams."
edition     = "2024"
homepage    = "https://github.com/callmeclover/guavagrams/"
license     = "Apache-2.0"
name        = "guavagrams"
readme      = "README.md"
repository  = "https://github.com/callmeclover/guavagrams.git"
version     = "0.1.0"

[dependencies]
color-eyre = "0.6.5"
csv        = "1.4.0"
itertools  = "0.14.0"
rand       = "0.9.2"
thiserror  = "2.0.17"
walkdir    = "2.5.0"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
crossterm = "0.29.0"
ratatui   = "0.29.0"

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "*", features = ["wasm_js"] }
ratatui   = { version = "0.29.0", default-features = false }
ratzilla  = "0.2.0"
console_error_panic_hook = "0.1.7"
web-time = "1.1.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
codegen-units = 1
