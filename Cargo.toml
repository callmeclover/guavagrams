[package]
name = "guavagrams"
version = "0.1.0"
edition = "2024"
description = "A digital version of the word game Bananagrams."
readme = "README.md"
homepage = "https://github.com/callmeclover/guavagrams/"
repository = "https://github.com/callmeclover/guavagrams.git"
license = "Apache-2.0"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
csv = "1.4.0"
itertools = "0.14.0"
rand = "0.9.2"
ratatui = "0.29.0"
thiserror = "2.0.17"
walkdir = "2.5.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.release]
codegen-units = 1
